body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f6f8f7;color:#1a2e22;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;background:#2e7d32;color:#fff;text-decoration:none;font-size:14px;font-weight:700;transition:background .15s}
.btn:hover{background:#1b5e20}
.btn-ghost{background:transparent;color:#2e7d32;border:1px solid #2e7d32;margin-left:8px}
.btn-ghost:hover{background:rgba(46,125,50,.08)}
