services:
  flower-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flower-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - JWT_SECRET=${JWT_SECRET}
      - API_GATEWAY_URL=http://100.96.54.109:3007
      - SCENE_SERVICE_URL=http://100.96.54.109:3012
      - SEO_SERVICE_URL=http://seo-service:3011
      - MINIO_REWRITE_FROM=http://100.96.54.109:9000
      - MINIO_REWRITE_TO=http://106.12.91.182/minio
      - PG_HOST=100.96.54.109
      - PG_PORT=5433
      - PG_USER=postgres
      - PG_PASSWORD=REDACTED-PGPASSWORD-2026
      - PG_DATABASE=supply_chain
      - API_KEY=REDACTED-APIKEY
    extra_hosts:
      - "host.docker.internal:host-gateway"

  flower-next:
    build:
      context: ./next-app
      dockerfile: Dockerfile.suzhou
    container_name: flower-next
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - flower-api
    environment:
      # 用 docker compose 服务名,避免走 k3s DNS (next.config.ts 默认 fallback 是 new-ecommerce.svc.cluster.local)
      - FLOWER_API_URL=http://flower-api:3010
      - SEO_SERVICE_URL=http://seo-service:3011
      - API_GATEWAY_URL=http://flower-api:3010
      - SUPPLIER_MAP_URL=
      - DEALER_MAP_URL=
    extra_hosts:
      - "host.docker.internal:host-gateway"

  seo-service:
    build:
      context: ./seo-service
      dockerfile: Dockerfile
    container_name: seo-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3011"
    env_file:
      - ./seo-service/.env
    environment:
      - NODE_ENV=production
      - PORT=3011
    extra_hosts:
      - "host.docker.internal:host-gateway"
