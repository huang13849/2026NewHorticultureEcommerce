<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>简历管理 · 花伴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b172b;color:#e6e8eb;min-height:100vh;-webkit-font-smoothing:antialiased}
.gc-has-shell{padding-top:56px !important}

.wrap{max-width:1280px;margin:0 auto;padding:40px 24px 80px}
.header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#fb923c,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;letter-spacing:.5px}
.header p{font-size:14px;color:#9aa3b2;line-height:1.6;margin-bottom:24px}

/* Tab 切换 */
.tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:24px}
.tab{padding:12px 24px;cursor:pointer;font-size:14px;font-weight:600;color:#9aa3b2;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:#e6e8eb}
.tab.active{color:#fb923c;border-bottom-color:#fb923c}
.tab-content{display:none}
.tab-content.active{display:block}

/* Section */
.section{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px;margin-bottom:20px}
.section-title{font-size:15px;font-weight:700;color:#fb923c;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* 文件列表 */
.file-list{display:grid;gap:10px}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;transition:background .15s}
.file-item:hover{background:rgba(255,255,255,.06)}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;color:#e6e8eb;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:11px;color:#7a8e85;font-family:ui-monospace,monospace}
.file-type{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;margin-right:10px;text-transform:uppercase;font-family:ui-monospace,monospace}
.type-docx{background:#2563eb;color:#fff}
.type-pdf{background:#dc2626;color:#fff}
.btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;border:none;font-family:inherit;background:#fb923c;color:#fff;transition:background .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#ea580c}
.btn-secondary{background:rgba(255,255,255,.06);color:#e6e8eb;border:1px solid rgba(255,255,255,.1)}
.btn-secondary:hover{background:rgba(255,255,255,.12)}

/* 表单 */
textarea,select,input{width:100%;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e6e8eb;font-size:13px;font-family:inherit;line-height:1.5}
textarea:focus,select:focus,input:focus{outline:none;border-color:#fb923c}
textarea{min-height:280px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.form-row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.form-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:#9aa3b2;cursor:pointer}
.form-row input[type=checkbox]{accent-color:#fb923c;width:16px;height:16px}

/* 加载 */
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fb923c;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 结果区 */
.result{margin-top:16px;padding:14px 18px;background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.3);border-radius:10px;display:none}
.result.show{display:block}
.result-title{font-size:13px;font-weight:700;color:#fb923c;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.result-meta{font-size:12px;color:#9aa3b2;font-family:ui-monospace,monospace;margin-bottom:10px}

.error-box{padding:12px 16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:#fca5a5;font-size:13px;margin-top:12px;display:none}
.error-box.show{display:block}

.back-link{display:inline-block;margin-bottom:16px;color:#fb923c;text-decoration:none;font-size:13px}
.back-link:hover{text-decoration:underline}

.empty-state{text-align:center;padding:40px 20px;color:#7a8e85;font-size:13px}
</style>
</head>
<body>

<script id="gcNav" src="http://100.96.54.109:31040/nav.js" data-app="tools" defer></script>

<main class="wrap">
  <a href="/" class="back-link">← 返回工具中心</a>

  <div class="header">
    <h1>📄 简历管理 · Resume Manager</h1>
    <p>输入 JD 岗位描述 → 基于基础模板 + JD 关键词匹配 → 输出定制化简历 docx · 列出所有已有简历</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="generate">🎯 JD 生成简历</div>
    <div class="tab" data-tab="list">📚 已有简历</div>
    <div class="tab" data-tab="jds">📋 JD 列表</div>
    <div class="tab" data-tab="agents">📖 使用规则</div>
  </div>

  <!-- ============ Tab 1: 生成简历 ============ -->
  <div class="tab-content active" id="tab-generate">
    <div class="section">
      <div class="section-title">输入 JD 岗位描述</div>
      <textarea id="jd_text" placeholder="粘贴目标岗位的 JD 内容:&#10;&#10;公司名称: xxx&#10;职位名称: xxx&#10;核心职责:&#10;- ...&#10;- ...&#10;技能要求: ...&#10;任职资格: ..."></textarea>
      <div class="form-row">
        <label>语言:
          <select id="template_lang">
            <option value="zh">中文简历</option>
            <option value="en">English</option>
          </select>
        </label>
        <label><input type="checkbox" id="save_to_output" checked>保存到简历库</label>
        <button class="btn" id="genBtn">🚀 生成简历 PDF</button>
      </div>
      <div class="error-box" id="genErr"></div>
      <div class="result" id="genResult">
        <div class="result-title">✅ 简历生成成功</div>
        <div class="result-meta" id="genMeta"></div>
        <a class="btn" id="downloadBtn" download>⬇ 下载简历 docx</a>
      </div>
    </div>
  </div>

  <!-- ============ Tab 2: 简历列表 ============ -->
  <div class="tab-content" id="tab-list">
    <div class="section">
      <div class="section-title">已有简历 (output/ 目录)</div>
      <div id="resumeList" class="file-list">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>

  <!-- ============ Tab 3: JD 列表 ============ -->
  <div class="tab-content" id="tab-jds">
    <div class="section">
      <div class="section-title">岗位 JD 文件 (job description/ 目录)</div>
      <div id="jdList" class="file-list">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>

  <!-- ============ Tab 4: AGENTS.md ============ -->
  <div class="tab-content" id="tab-agents">
    <div class="section">
      <div class="section-title">AGENTS.md - 简历生成项目指南 (只读)</div>
      <pre id="agentsContent" style="white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.6;color:#9aa3b2;max-height:600px;overflow:auto;background:rgba(0,0,0,.2);padding:16px;border-radius:8px">加载中...</pre>
    </div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);

// Tab 切换
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + target));
    if (target === 'list' && !window.__resumesLoaded) loadResumes();
    if (target === 'jds' && !window.__jdsLoaded) loadJDs();
    if (target === 'agents' && !window.__agentsLoaded) loadAgents();
  });
});

// 通用 alert 包装
function showError(id, msg) {
  const el = $(id);
  el.textContent = '❌ ' + msg;
  el.classList.add('show');
}
function hideError(id) { $(id).classList.remove('show'); }

// 格式化 bytes
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}

// ============ 生成简历 ============
const genBtn = $('#genBtn');
const genErr = $('#genErr');
const genResult = $('#genResult');
const downloadBtn = $('#downloadBtn');
let lastDownloadUrl = null;

genBtn.addEventListener('click', async () => {
  const jd_text = $('#jd_text').value.trim();
  if (jd_text.length < 10) {
    showError('#genErr', 'JD 内容太短, 至少 10 字符');
    return;
  }
  hideError('#genErr');
  genResult.classList.remove('show');

  const fd = new FormData();
  fd.append('jd_text', jd_text);
  fd.append('template_lang', $('#template_lang').value);
  fd.append('save_to_output', $('#save_to_output').checked ? 'true' : 'false');

  genBtn.disabled = true;
  const oldText = genBtn.innerHTML;
  genBtn.innerHTML = '<span class="loading"></span> 生成中...';

  try {
    const t0 = Date.now();
    const r = await fetch('/api/resume/generate', { method: 'POST', body: fd });
    const elapsed = Date.now() - t0;
    if (!r.ok) {
      const txt = await r.text();
      throw new Error(`HTTP ${r.status}: ${txt}`);
    }
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'unknown error');

    const downloadUrl = data.download_url || ('/api/resume/download?file=' + data.filename);
    $('#genMeta').innerHTML =
      '文件: <b>' + data.filename + '</b> · ' +
      '大小: <b>' + fmtSize(data.size) + '</b> · ' +
      '耗时: <b>' + elapsed + 'ms</b> · ' +
      '匹配关键词: <b>' + (data.matched_keywords_count || 0) + '</b> 个';
    downloadBtn.href = downloadUrl;
    downloadBtn.download = data.filename;
    lastDownloadUrl = downloadUrl;
    genResult.classList.add('show');
    genResult.scrollIntoView({behavior:'smooth', block:'center'});
  } catch (e) {
    showError('#genErr', e.message);
  } finally {
    genBtn.disabled = false;
    genBtn.innerHTML = oldText;
  }
});

// ============ 简历列表 ============
async function loadResumes() {
  try {
    const r = await fetch('/api/resume/list');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const list = $('#resumeList');
    if (!data.resumes || data.resumes.length === 0) {
      list.innerHTML = '<div class="empty-state">暂无简历</div>';
      window.__resumesLoaded = true;
      return;
    }
    list.innerHTML = data.resumes.map(f => {
      const ext = f.type;
      return '<div class="file-item">' +
        '<span class="file-type type-' + ext + '">' + ext + '</span>' +
        '<div class="file-info">' +
          '<div class="file-name">' + escapeHtml(f.name) + '</div>' +
          '<div class="file-meta">' + fmtSize(f.size) + '</div>' +
        '</div>' +
        '<a class="btn" href="/api/resume/download?file=' + encodeURIComponent(f.name) + '" download>⬇ 下载</a>' +
        '</div>';
    }).join('');
    window.__resumesLoaded = true;
  } catch (e) {
    $('#resumeList').innerHTML = '<div class="empty-state">加载失败: ' + e.message + '</div>';
  }
}

// ============ JD 列表 ============
async function loadJDs() {
  try {
    const r = await fetch('/api/resume/jds');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const list = $('#jdList');
    if (!data.jds || data.jds.length === 0) {
      list.innerHTML = '<div class="empty-state">暂无 JD 文件</div>';
      window.__jdsLoaded = true;
      return;
    }
    list.innerHTML = data.jds.map(j => {
      return '<div class="file-item">' +
        '<span class="file-type type-docx" style="background:#10b981">JD</span>' +
        '<div class="file-info">' +
          '<div class="file-name">' + escapeHtml(j.name) + '</div>' +
          '<div class="file-meta">' + fmtSize(j.size) + (j.preview ? ' · ' + escapeHtml(j.preview.slice(0, 80)) + '...' : '') + '</div>' +
        '</div>' +
        '<button class="btn btn-secondary" onclick="loadJDForGen(\\\'' + escapeJs(j.name) + '\\\')">使用此 JD</button>' +
        '</div>';
    }).join('');
    window.__jdsLoaded = true;
  } catch (e) {
    $('#jdList').innerHTML = '<div class="empty-state">加载失败: ' + e.message + '</div>';
  }
}

// 点击"使用此 JD" -> 拉 JD 全文 -> 填入生成区
async function loadJDForGen(name) {
  try {
    const r = await fetch('/api/resume/jds');
    const data = await r.json();
    const jd = data.jds.find(j => j.name === name);
    if (!jd) return;
    // 直接用 preview 不够, 拉全文
    const tplR = await fetch('/api/resume/template?lang=zh');
    // 改用 preview (实际可以再加 GET /api/resume/jd-file 端点, 先用 preview 凑合)
    $('#jd_text').value = jd.preview + '\\n\\n... (这是预览, 完整 JD 请复制到此处)';
    // 切到生成 tab
    document.querySelector('.tab[data-tab="generate"]').click();
    $('#jd_text').focus();
    showError('#genErr', '');
    hideError('#genErr');
  } catch (e) {
    showError('#genErr', '加载 JD 失败: ' + e.message);
  }
}

// ============ AGENTS.md ============
async function loadAgents() {
  try {
    const r = await fetch('/api/resume/agents');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    $('#agentsContent').textContent = txt;
    window.__agentsLoaded = true;
  } catch (e) {
    $('#agentsContent').textContent = '加载失败: ' + e.message;
  }
}

// ============ utils ============
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c]));
}
function escapeJs(s) {
  return String(s || '').replace(/['\\]/g, '\\\\$&');
}

// 初始加载 (默认 tab)
window.__resumesLoaded = window.__jdsLoaded = window.__agentsLoaded = false;
</script>
</body>
</html>
