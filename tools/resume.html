<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>简历管理 · 花伴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b172b;color:#e6e8eb;min-height:100vh;-webkit-font-smoothing:antialiased}
.gc-has-shell{padding-top:56px !important}

.wrap{max-width:1280px;margin:0 auto;padding:40px 24px 80px}
.header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#fb923c,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;letter-spacing:.5px}
.header p{font-size:14px;color:#9aa3b2;line-height:1.6;margin-bottom:24px}

/* Tab */
.tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:24px}
.tab{padding:12px 24px;cursor:pointer;font-size:14px;font-weight:600;color:#9aa3b2;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:#e6e8eb}
.tab.active{color:#fb923c;border-bottom-color:#fb923c}
.tab-content{display:none}
.tab-content.active{display:block}

.section{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px;margin-bottom:20px}
.section-title{font-size:15px;font-weight:700;color:#fb923c;margin-bottom:16px;display:flex;align-items:center;gap:8px}

input,textarea,select{width:100%;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e6e8eb;font-size:13px;font-family:inherit;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:#fb923c}
textarea{min-height:280px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}

.btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;border:none;font-family:inherit;background:#fb923c;color:#fff;transition:background .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#ea580c}
.btn-secondary{background:rgba(255,255,255,.06);color:#e6e8eb;border:1px solid rgba(255,255,255,.1)}
.btn-secondary:hover{background:rgba(255,255,255,.12)}
.btn-small{padding:6px 12px;font-size:12px}
.btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}

.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fb923c;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.result{margin-top:16px;padding:14px 18px;background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.3);border-radius:10px;display:none}
.result.show{display:block}
.result-title{font-size:13px;font-weight:700;color:#fb923c;margin-bottom:8px}
.result-meta{font-size:12px;color:#9aa3b2;font-family:ui-monospace,monospace;margin-bottom:10px}
.error-box{padding:12px 16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:#fca5a5;font-size:13px;margin-top:12px;display:none}
.error-box.show{display:block}

.back-link{display:inline-block;margin-bottom:16px;color:#fb923c;text-decoration:none;font-size:13px}
.back-link:hover{text-decoration:underline}

.file-list{display:grid;gap:10px}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px}
.file-item:hover{background:rgba(255,255,255,.06)}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;color:#e6e8eb;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:11px;color:#7a8e85;font-family:ui-monospace,monospace}
.btn-mini{padding:5px 10px;font-size:11px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-weight:600;background:rgba(251,146,60,.2);color:#fb923c}
.btn-mini:hover{background:rgba(251,146,60,.3)}

.empty-state{text-align:center;padding:40px 20px;color:#7a8e85;font-size:13px}

.jd-form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.jd-form-row.single{grid-template-columns:1fr}

.modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-backdrop.show{display:flex}
.modal{background:#1a2538;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:24px;max-width:560px;width:90%}
.modal h3{font-size:16px;color:#fb923c;margin-bottom:16px}
.modal textarea{min-height:200px;margin-bottom:12px}

.saved-jd-banner{padding:10px 14px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:8px;color:#86efac;font-size:12px;margin-bottom:12px;display:none}
.saved-jd-banner.show{display:block}
</style>
</head>
<body>

<script id="gcNav" src="http://100.96.54.109:31040/nav.js" data-app="tools" defer></script>

<main class="wrap">
  <a href="/" class="back-link">← 返回工具中心</a>

  <div class="header">
    <h1>📄 简历管理 · Resume Manager</h1>
    <p>基于南威 docx 模板定制生成 · 列出所有已有简历</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="generate">🎯 JD 生成简历</div>
    <div class="tab" data-tab="list">📚 已有简历</div>
    <div class="tab" data-tab="jds">📋 JD 列表</div>
    <div class="tab" data-tab="agents">📖 使用规则</div>
  </div>

  <!-- ============ Tab 1: 生成简历 ============ -->
  <div class="tab-content active" id="tab-generate">
    <div class="section">
      <div class="section-title">输入 JD 生成简历</div>

      <div class="saved-jd-banner" id="savedJdBanner">
        ✅ 已保存到 JD 列表 (<span id="savedJdName"></span>)
        <button class="btn-mini" style="margin-left:10px" onclick="clearSavedJd()">清除</button>
      </div>

      <div class="jd-form-row">
        <div>
          <label style="display:block;font-size:12px;color:#9aa3b2;margin-bottom:6px">公司名称</label>
          <input id="jd_company"/>
        </div>
        <div>
          <label style="display:block;font-size:12px;color:#9aa3b2;margin-bottom:6px">岗位名称</label>
          <input id="jd_title"/>
        </div>
      </div>

      
      <textarea id="jd_text"></textarea>

      <div class="btn-row">
        <button class="btn-secondary btn-small" onclick="saveJD()">💾 保存 JD 到列表</button>
        <button class="btn" id="genBtn">🚀 生成定制简历 (docx)</button>
      </div>

      <div class="error-box" id="genErr"></div>
      <div class="result" id="genResult">
        <div class="result-title">✅ 简历生成成功</div>
        <div class="result-meta" id="genMeta"></div>
        <a class="btn btn-small" id="downloadBtn" download>⬇ 下载 docx</a>
      </div>
    </div>
  </div>

  <!-- ============ Tab 2: 简历列表 ============ -->
  <div class="tab-content" id="tab-list">
    <div class="section">
      <div class="section-title">已有简历 (output/ 目录)</div>
      <div id="resumeList" class="file-list">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>

  <!-- ============ Tab 3: JD 列表 ============ -->
  <div class="tab-content" id="tab-jds">
    <div class="section">
      <div class="section-title">岗位 JD 文件 (job description/ 目录)</div>
      <div id="jdList" class="file-list">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>

  <!-- ============ Tab 4: AGENTS.md ============ -->
  <div class="tab-content" id="tab-agents">
    <div class="section">
      <div class="section-title">AGENTS.md - 简历生成项目指南 (只读)</div>
      <pre id="agentsContent" style="white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;color:#9aa3b2;max-height:600px;overflow:auto;background:rgba(0,0,0,.2);padding:16px;border-radius:8px">加载中...</pre>
    </div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

// Tab 切换
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.tab;
    $$('.tab').forEach(t => t.classList.toggle('active', t === tab));
    $$('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + target));
    if (target === 'list' && !window.__resumesLoaded) loadResumes();
    if (target === 'jds' && !window.__jdsLoaded) loadJDs();
    if (target === 'agents' && !window.__agentsLoaded) loadAgents();
  });
});

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}

function showError(id, msg) {
  const el = $(id);
  el.textContent = '❌ ' + msg;
  el.classList.add('show');
}
function hideError(id) { $(id).classList.remove('show'); }

// 保存 JD 到列表
async function saveJD() {
  const company = $('#jd_company').value.trim();
  const title = $('#jd_title').value.trim();
  const jd_text = $('#jd_text').value.trim();
  if (!company || !title || jd_text.length < 10) {
    showError('#genErr', '公司 / 岗位 / JD 都必填 (JD 至少 10 字符)');
    return;
  }
  hideError('#genErr');
  try {
    const fd = new FormData();
    fd.append('company', company);
    fd.append('title', title);
    fd.append('jd_text', jd_text);
    const r = await fetch('/api/resume/jds/save', { method: 'POST', body: fd });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'save failed');
    $('#savedJdName').textContent = data.filename;
    $('#savedJdBanner').classList.add('show');
  } catch (e) {
    showError('#genErr', '保存 JD 失败: ' + e.message);
  }
}

function clearSavedJd() {
  $('#savedJdBanner').classList.remove('show');
}

// 生成简历
const genBtn = $('#genBtn');
genBtn.addEventListener('click', async () => {
  const company = $('#jd_company').value.trim();
  const title = $('#jd_title').value.trim();
  const jd_text = $('#jd_text').value.trim();
  if (jd_text.length < 10) {
    showError('#genErr', 'JD 内容太短, 至少 10 字符');
    return;
  }
  hideError('#genErr');
  $('#genResult').classList.remove('show');

  const fd = new FormData();
  fd.append('jd_text', jd_text);
  fd.append('company', company);
  fd.append('title', title);
  fd.append('save_to_output', 'true');

  genBtn.disabled = true;
  const oldText = genBtn.innerHTML;
  genBtn.innerHTML = '<span class="loading"></span> 生成中...';

  try {
    const t0 = Date.now();
    const r = await fetch('/api/resume/generate', { method: 'POST', body: fd });
    const elapsed = Date.now() - t0;
    if (!r.ok) {
      const txt = await r.text();
      throw new Error(`HTTP ${r.status}: ${txt}`);
    }
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'unknown error');

    $('#genMeta').innerHTML =
      '文件: <b>' + escapeHtml(data.filename) + '</b><br>' +
      '公司: <b>' + escapeHtml(data.company || '-') + '</b> · ' +
      '岗位: <b>' + escapeHtml(data.title || '-') + '</b><br>' +
      '大小: <b>' + fmtSize(data.size) + '</b> · ' +
      '耗时: <b>' + elapsed + 'ms</b> · ' +
      '匹配关键词: <b>' + (data.matched_keywords_count || 0) + '</b> 个';
    $('#downloadBtn').href = data.download_url;
    $('#downloadBtn').download = data.filename;
    $('#genResult').classList.add('show');
    $('#genResult').scrollIntoView({behavior:'smooth', block:'center'});
    // 刷新简历列表
    window.__resumesLoaded = false;
  } catch (e) {
    showError('#genErr', e.message);
  } finally {
    genBtn.disabled = false;
    genBtn.innerHTML = oldText;
  }
});

async function loadResumes() {
  try {
    const r = await fetch('/api/resume/list');
    const data = await r.json();
    const list = $('#resumeList');
    if (!data.resumes || data.resumes.length === 0) {
      list.innerHTML = '<div class="empty-state">暂无简历</div>';
      window.__resumesLoaded = true;
      return;
    }
    list.innerHTML = data.resumes.map(f => {
      return '<div class="file-item">' +
        '<span class="file-type" style="background:#2563eb;color:#fff;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-right:10px">' + f.type.toUpperCase() + '</span>' +
        '<div class="file-info">' +
          '<div class="file-name">' + escapeHtml(f.name) + '</div>' +
          '<div class="file-meta">' + fmtSize(f.size) + '</div>' +
        '</div>' +
        '<a class="btn-mini" href="/api/resume/download?file=' + encodeURIComponent(f.name) + '" download>⬇ 下载</a>' +
        '</div>';
    }).join('');
    window.__resumesLoaded = true;
  } catch (e) {
    $('#resumeList').innerHTML = '<div class="empty-state">加载失败: ' + e.message + '</div>';
  }
}

async function loadJDs() {
  try {
    const r = await fetch('/api/resume/jds');
    const data = await r.json();
    const list = $('#jdList');
    if (!data.jds || data.jds.length === 0) {
      list.innerHTML = '<div class="empty-state">暂无 JD 文件</div>';
      window.__jdsLoaded = true;
      return;
    }
    list.innerHTML = data.jds.map(j => {
      return '<div class="file-item">' +
        '<span style="background:#10b981;color:#fff;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-right:10px">JD</span>' +
        '<div class="file-info">' +
          '<div class="file-name">' + escapeHtml(j.name) + '</div>' +
          '<div class="file-meta">' + fmtSize(j.size) + '</div>' +
        '</div>' +
        '<button class="btn-mini" data-jd-action="use" data-jd-name="' + escapeHtml(j.name) + '" onclick="loadJDToGen(this.dataset.jdName)">使用此 JD</button>' +
        '<button class="btn-mini" style="margin-left:6px;background:rgba(239,68,68,.2);color:#fca5a5" data-jd-action="del" data-jd-name="' + escapeHtml(j.name) + '" onclick="deleteJD(this.dataset.jdName)">删</button>' +
        '</div>';
    }).join('');
    window.__jdsLoaded = true;
  } catch (e) {
    $('#jdList').innerHTML = '<div class="empty-state">加载失败: ' + e.message + '</div>';
  }
}

// 点击"使用此 JD" -> 加载 JD 全文 + 公司 + 岗位
async function loadJDToGen(name) {
  try {
    const r = await fetch('/api/resume/jds/get?name=' + encodeURIComponent(name));
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    $('#jd_company').value = data.company || '';
    $('#jd_title').value = data.title || '';
    $('#jd_text').value = data.jd_text || '';
    $$('.tab').find(t => t.dataset.tab === 'generate').click();
    $('#jd_text').focus();
    hideError('#genErr');
  } catch (e) {
    showError('#genErr', '加载 JD 失败: ' + e.message);
  }
}

async function deleteJD(name) {
  if (!confirm('确认删除 JD "' + name + '"?')) return;
  try {
    const r = await fetch('/api/resume/jds/delete?name=' + encodeURIComponent(name), { method: 'DELETE' });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'delete failed');
    window.__jdsLoaded = false;
    loadJDs();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

async function loadAgents() {
  try {
    const r = await fetch('/api/resume/agents');
    const txt = await r.text();
    $('#agentsContent').textContent = txt;
    window.__agentsLoaded = true;
  } catch (e) {
    $('#agentsContent').textContent = '加载失败: ' + e.message;
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c]));
}
function escapeJs(s) {
  return String(s || '').replace(/['\\]/g, '\\\\$&');
}

window.__resumesLoaded = window.__jdsLoaded = window.__agentsLoaded = false;
# Event delegation for JD buttons (避免 inline onclick string escape 问题)
document.addEventListener("click", function(e){
  var btn = e.target.closest("[data-jd-action]");
  if (!btn) return;
  var name = btn.getAttribute("data-jd-name");
  if (btn.getAttribute("data-jd-action") === "use") {
    loadJDToGen(name);
  } else if (btn.getAttribute("data-jd-action") === "del") {
    deleteJD(name);
  }
});

</script>
</body>
</html>
